n;align-items:end;gap:16px;margin-bottom:24px}.head p:not(.eyebrow){margin-top:10px;color:var(--muted)}.button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 13px;color:var(--ink);font-weight:650;text-decoration:none;display:inline-block;white-space:nowrap}.primary{background:var(--accent);border-color:var(--accent);color:var(--side)}.button:hover{filter:brightness(.95)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:15px 16px}.stat:first-child{background:#FFF0E5}.stat strong{display:block;font-size:30px;line-height:1.2;margin:6px 0 3px;letter-spacing:-.045em}.stat span{font-weight:700;font-size:13px}.bar{padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}input,select,textarea{width:100%;border:1px solid #BBC2CB;border-radius:7px;background:white;color:var(--ink);padding:9px 10px}textarea{resize:vertical;min-height:80px}.controls input,.controls select{width:auto;max-width:100%}.search{min-width:155px}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#F5F6F8;color:#525C68;font-size:11px;letter-spacing:.06em;text-transform:uppercase}td,th{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}td small{display:block}.plate{display:inline-block;background:#f8e69f;border:1px solid #e5d180;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.07em;padding:2px 6px;white-space:nowrap}.pill{display:inline-block;border-radius:20px;background:#e9eee8;color:#36473c;padding:3px 8px;font-size:11px;font-weight:750;white-space:nowrap}.pill.Requested,.pill.Awaiting{background:#f9edcd;color:#634507}.pill.In{background:#e4ecf8;color:#25466f}.pill.Ready,.pill.Completed,.pill.Confirmed{background:#e5f1e1;color:#295336}.pill.Cancelled,.pill.No-show{background:#f6e6e1;color:#803f30}.empty{padding:25px;color:var(--muted)}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.pad{padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.fields label,.stack label{display:block;font-weight:650;font-size:13px}.fields input,.fields select,.fields textarea,.stack input,.stack select,.stack textarea{margin-top:4px}.wide{grid-column:1/-1}.stack{display:grid;gap:12px}.public{max-width:970px;margin:auto;padding:35px 18px 55px}.public-nav{background:var(--side);color:#fff}.public-nav .top{background:none;border:0;max-width:970px;margin:auto;padding:13px 18px}.public-intro{padding:26px;background:#FFF0E5;border-radius:13px;margin-bottom:18px}.public-intro p:last-child{margin-top:10px;color:var(--muted)}.services{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{position:relative;display:block;border:1px solid var(--line);padding:10px;border-radius:8px;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:#FFF0E5}.choice input{width:auto;margin-right:5px}.choice small{display:block;margin:2px 0 0 21px}.summary{background:#F5F6F8;border:1px solid #D9DDE3;border-radius:9px;padding:13px}.step{color:var(--green);font-size:13px;font-weight:750;margin-bottom:5px}dialog{border:1px solid var(--line);border-radius:13px;padding:0;width:min(620px,calc(100vw - 24px));color:var(--ink);max-height:90vh}dialog::backdrop{background:#0F1114B0}.dialog-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.error{color:#8c301e;margin:6px 0}.ok{color:var(--green);font-weight:700}.rule{border-top:1px solid var(--line);margin:13px 0}.notice{background:#faf1d6;color:#584817;border-radius:7px;padding:7px 10px;font-size:12px}.row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;justify-content:space-between;align-items:center}.row:last-child{border:0}.action{padding:5px 9px;font-size:12px}

</style></head><body><div id="app"></div><dialog id="dialog"></dialog>
<script>
'use strict';
const app=document.querySelector('#app'), dialog=document.querySelector('#dialog');
const services={
  'MOT test':{length:60,price:'£49',description:'Class 4 test for cars and eligible light vehicles'},
  'Interim service':{length:90,price:'From £129',description:'Oil, filter and essential checks'},
  'Full service':{length:120,price:'From £199',description:'A full service and vehicle checks'},
  'MOT + full service':{length:180,price:'From £239',description:'Book both in one visit'},
  'Diagnostics':{length:60,price:'From £65',description:'Warning lights, faults or unusual noises'},
  'Repair enquiry':{length:60,price:'Quote required',description:'Tell us what needs looking at'}
};
const defaultPrices=Object.fromEntries(Object.entries(services).map(([key,service])=>[key,{
 mode:service.price.startsWith('From')?'From':service.price.includes('£')?'Fixed':'Quote required',
 amount:service.price.includes('£')?Number(service.price.split('£')[1])*100:null
}]));
const states=['Requested','Confirmed','Checked in','In progress','Awaiting approval','Ready to collect','Completed','Cancelled','No-show'];
const uk=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'});
const dateKey=d=>{const parts=Object.fromEntries(uk.formatToParts(d).map(p=>[p.type,p.value]));return parts.year+'-'+parts.month+'-'+parts.day};
const today=()=>dateKey(new Date());
const dateText=d=>new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00Z'));
const advance=(d,n)=>new Date(Date.parse(d+'T12:00Z')+n*86400000).toISOString().slice(0,10);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plate=v=>escapeHTML(v.length>4?v.slice(0,-3)+' '+v.slice(-3):v);
const icons={Diary:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/>',Customers:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2m2-15a3 3 0 0 1 0 6m1 3a4 4 0 0 1 3 4v2"/>',Vehicles:'<path d="m4 11 2-5h12l2 5M3 12h18v6H3zM5 18v3m14-3v3M6 15h2m8 0h2"/>',Suppliers:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3m-13 6h18"/>',Finances:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-14 5h4"/>',Settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/>'};
icons.Reminders='<rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>';
const icon=name=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'+icons[name]+'</svg>';
const isClosed=j=>['Cancelled','No-show'].includes(j.status);
const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
const lanes=s=>s.startsWith('MOT')?['MOT bay']:['Workshop 1','Workshop 2'];
function normalise(data){return {...data,prices:data.prices||{},hours:data.hours||defaultHours(),overrides:data.overrides||{},expenses:data.expenses||[],suppliers:data.suppliers||[],invoiceSequence:data.invoiceSequence||0}}
const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const bankHolidays=new Set(('2026-01-01 2026-04-03 2026-04-06 2026-05-04 2026-05-25 2026-08-31 2026-12-25 2026-12-28 2027-01-01 2027-03-26 2027-03-29 2027-05-03 2027-05-31 2027-08-30 2027-12-27 2027-12-28 2028-01-03 2028-04-14 2028-04-17 2028-05-01 2028-05-29 2028-08-28 2028-12-25 2028-12-26').split(' '));
const defaultHours=()=>weekdays.map((_,i)=>i===0||i===6?null:['08:30','17:30']);
const weekday=d=>new Date(d+'T12:00Z').getUTCDay();
const defaultHoliday=d=>bankHolidays.has(d)||['12-25','12-26'].includes(d.slice(5));
function opening(date,m=model){
 if(Object.hasOwn(m.overrides,date))return m.overrides[date];
 if(m.blocks.includes(date)||defaultHoliday(date))return null;
 return m.hours[weekday(date)];
}
const gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const money=p=>gbp.format(p/100);
const pennies=v=>v===''||v==null?null:Math.round(Number(v)*100);
const decimal=p=>p==null?'':(p/100).toFixed(2);
const amountOpts='type="number" inputmode="decimal" min="0" max="999999.99" step="0.01"';
const methodList=['Card','Cash','Bank transfer','Other'];
const servicePrice=name=>model.prices[name]||defaultPrices[name];
function priceLabel(name){const p=servicePrice(name);return p.mode==='Quote required'?p.mode:(p.mode==='From'?'From ':'')+money(p.amount)}
const partsTotal=j=>(j.parts||[]).reduce((sum,p)=>sum+p.qty*p.cost,0);
const paymentsTotal=j=>(j.payments||[]).reduce((sum,p)=>sum+p.amount,0);
const outstanding=j=>j.total==null?null:Math.max(0,j.total-paymentsTotal(j));
function downloadCsv(name,rows){
 const quote=v=>{const s=String(v??'');return '"'+(/^[\s]*[=+@-]|^[\t\r\n]/.test(s)?"'":'')+s.replaceAll('"','""')+'"'};
 const href=URL.createObjectURL(new Blob([rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=href;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);
}
function settingsPanels(){
 const host=document.querySelector('#content');
 host.insertAdjacentHTML('afterbegin','<div class="stack" style="margin-bottom:16px">'+
 '<section class="panel pad"><h2>Service prices</h2><p class="muted">Set what drivers see on the booking page. Saved job totals stay as entered.</p><form id="prices"><div class="settings-grid">'+Object.keys(services).map(name=>{const p=servicePrice(name);return '<div class="setting-row" data-service="'+escapeHTML(name)+'"><strong>'+escapeHTML(name)+'</strong><label>Price type<select name="mode">'+optionList(['Fixed','From','Quote required'],p.mode)+'</select></label>'+field('Price (£)','amount',decimal(p.amount),amountOpts+(p.mode==='Quote required'?' disabled':' required'))+'</div>'}).join('')+'</div><button class="button primary">Save prices</button><span class="muted" role="status"></span></form></section>'+
 '<section class="panel pad"><h2>Weekly opening hours</h2><p class="muted">Set each day separately. Appointment times follow these hours and the length of the service.</p><form id="hours"><div class="settings-grid">'+[1,2,3,4,5,6,0].map(i=>hoursRow(weekdays[i],model.hours[i],i)).join('')+'</div><p class="error" role="alert"></p><button class="button primary">Save hours</button></form></section>'+
 '<section class="panel pad"><h2>Bank holidays and date overrides</h2><p class="muted">England and Wales bank holidays and 25–26 December are closed by default. Open a specific day with custom hours, or add an extra closure. Existing bookings are kept in the diary.</p><form id="override"><div class="fields">'+field('Date','date',today(),'type="date" required')+'<label>Booking availability<select name="mode">'+optionList(['Closed','Open with custom hours'])+'</select></label>'+field('Opens','opens','08:30','type="time" disabled required')+field('Closes','closes','17:30','type="time" disabled required')+'</div><p class="error" role="alert"></p><button class="button primary">Save date override</button></form><div id="dates-list"></div></section></div>');
 const prices=host.querySelector('#prices');
 prices.querySelectorAll('[data-service]').forEach(row=>row.querySelector('select').onchange=e=>{const input=row.querySelector('input');input.disabled=e.target.value==='Quote required';input.required=!input.disabled});
 prices.onsubmit=async e=>{
  e.preventDefault();

  for(const row of prices.querySelectorAll('[data-service]')){
   const mode=row.querySelector('select').value;
   model.prices[row.dataset.service]={mode,amount:mode==='Quote required'?null:pennies(row.querySelector('input').value)};
  }
  await persist();prices.querySelector('[role=status]').textContent=' Prices saved.';
 };
 const hours=host.querySelector('#hours');
 hours.querySelectorAll('[data-weekday]').forEach(row=>row.querySelector('input[type=checkbox]').onchange=e=>row.querySelectorAll('input[type=time]').forEach(input=>input.disabled=e.target.checked));
 hours.onsubmit=async e=>{
  e.preventDefault();
  const next=defaultHours(),msg=hours.querySelector('.error');
  for(const row of hours.querySelectorAll('[data-weekday]')){
   const [closed,open,close]=row.querySelectorAll('input');
   if(!closed.checked&&open.value>=close.value){msg.textContent='Closing time must be later than opening time for '+weekdays[row.dataset.weekday]+'.';return}
   next[row.dataset.weekday]=closed.checked?null:[open.value,close.value];
  }
  model.hours=next;await persist();msg.textContent='Opening hours saved.';
 };
 const override=host.querySelector('#override');
 const toggle=()=>{for(const k of ['opens','closes'])override.elements[k].disabled=override.elements.mode.value==='Closed'};
 override.elements.mode.onchange=toggle;
 override.onsubmit=async e=>{
  e.preventDefault();
  const {date,mode,opens,closes}=Object.fromEntries(new FormData(override));
  if(mode!=='Closed'&&opens>=closes){override.querySelector('.error').textContent='Closing time must be later than opening time.';return}
  model.overrides[date]=mode==='Closed'?null:[opens,closes];model.blocks=model.blocks.filter(d=>d!==date);await persist();renderSettings();
 };
 const dates=[...new Set([...Object.keys(model.overrides),...model.blocks])].sort();
 host.querySelector('#dates-list').innerHTML=dates.map(d=>'<div class="row"><span>'+escapeHTML(dateText(d))+' · '+(model.overrides[d]?model.overrides[d].join('–'):'Closed')+'</span><button class="button action" data-clear-date="'+escapeHTML(d)+'">Use default</button></div>').join('');
 host.querySelectorAll('[data-clear-date]').forEach(b=>b.onclick=async()=>{const d=b.dataset.clearDate;delete model.overrides[d];model.blocks=model.blocks.filter(day=>day!==d);await persist();renderSettings()});
}
function hoursRow(name,hours,i){
 return '<div class="setting-row" data-weekday="'+i+'"><strong>'+name+'</strong><label class="check"><input type="checkbox" '+(hours?'':'checked')+'> Closed</label>'+field('Opens','open',hours?.[0]||'08:30','type="time" required '+(hours?'':'disabled'))+field('Closes','close',hours?.[1]||'17:30','type="time" required '+(hours?'':'disabled'))+'</div>';
}
function jobAccounts(form,job){
 form.querySelector('#job-accounts').innerHTML='<div class="rule"></div><h2>Job costs and payments</h2><div class="fields">'+field('Agreed customer total (£)','total',decimal(job.total),amountOpts+(job.work?.invoice?' readonly':' placeholder="Leave blank until agreed"'))+'</div><p class="muted">Enter the full price agreed with the customer, including parts and labour.</p><p id="job-balance" class="ok"></p><div class="rule"></div><h3>Parts and orders</h3><p class="muted">Record costs and track when parts are expected or have arrived.</p><div id="parts"></div><button type="button" class="button action" data-add="parts">Add part</button><div class="rule"></div><h3>Payments received</h3><div id="payments"></div><button type="button" class="button action" data-add="payments">Add payment</button><div class="rule"></div>';
 const recalc=()=>{
  const total=pennies(form.elements.total.value);
  const paid=Array.from(form.querySelectorAll('#payments [name=amount]')).reduce((sum,input)=>sum+(pennies(input.value)||0),0);
  form.querySelector('#job-balance').textContent='Received '+money(paid)+(total==null?' · Total not agreed':' · Balance '+money(Math.max(0,total-paid))+(paid>total?' · Overpaid '+money(paid-total):''));
 };
 const add=(kind,item={})=>{
  const row=document.createElement('fieldset');row.className='ledger-line';
  row.innerHTML='<legend>'+(kind==='parts'?'Part':'Payment')+'</legend><div class="fields">'+(kind==='parts'?
   field('Part name','part',item.part,'required maxlength="100"')+field('Supplier','supplier',item.supplier,'list="supplier-list" maxlength="100"')+field('Part or invoice reference','reference',item.reference,'maxlength="80"')+field('Quantity','qty',item.qty||1,'type="number" min="1" max="999" step="1" required')+field('Unit cost (£)','cost',decimal(item.cost),amountOpts+' placeholder="Leave blank until known"')+
   '<label>Part status<select name="partStatus">'+optionList(partStates,item.status||'Used')+'</select></label>'+
   field('Expected delivery','expected',item.expected,'type="date"'):
   field('Date received','dateReceived',item.date||today(),'type="date" required')+field('Amount (£)','amount',decimal(item.amount),amountOpts.replace('min="0"','min="0.01"')+' required')+'<label>Method<select name="method">'+optionList(methodList,item.method)+'</select></label>')+'</div><button type="button" class="button action">Remove '+(kind==='parts'?'part':'payment')+'</button>';
  form.querySelector('#'+kind).append(row);row.querySelector('button').onclick=()=>{row.remove();recalc()};recalc();
  if(kind==='parts'){
   const input=row.querySelector('[name=supplier]'),links=document.createElement('div');
   row.append(links);
   const refresh=()=>{const supplier=model.suppliers.find(s=>s.name.toLowerCase()===input.value.trim().toLowerCase());links.innerHTML=supplier?supplierLinks(supplier):''};
   input.addEventListener('input',refresh);refresh();
  }
 };
 form.querySelector('#job-accounts').insertAdjacentHTML('beforeend','<datalist id="supplier-list">'+[...new Set([...model.suppliers.map(s=>s.name),...model.jobs.flatMap(j=>(j.parts||[]).map(p=>p.supplier))].filter(Boolean))].sort().map(s=>'<option value="'+escapeHTML(s)+'"></option>').join('')+'</datalist>');
 for(const kind of ['parts','payments']){
  for(const item of job[kind]||[])add(kind,item);
  form.querySelector('[data-add='+kind+']').onclick=()=>add(kind);
 }
 form.querySelector('#job-accounts').oninput=recalc;recalc();
}
function readJobAccounts(form){
 const get=(row,name)=>row.querySelector('[name='+name+']').value.trim();
 return {total:pennies(form.elements.total.value),
  parts:Array.from(form.querySelectorAll('#parts fieldset'),row=>({part:get(row,'part'),supplier:get(row,'supplier'),reference:get(row,'reference'),qty:Number(get(row,'qty')),cost:pennies(get(row,'cost')),status:get(row,'partStatus'),expected:get(row,'expected')})),
  payments:Array.from(form.querySelectorAll('#payments fieldset'),row=>({date:get(row,'dateReceived'),amount:pennies(get(row,'amount')),method:get(row,'method')}))};

function supplierUrl(value){

async function issueInvoice(id,draft){

  const approved=latestEstimate(work);
  if(work.invoice||job.status!=='Completed'||approved?.decision?.result!=='Approved')throw Error('Complete the job and approve the latest estimate first.');

  model.invoiceSequence+=1;
  work.invoice={number:'WD-'+String(model.invoiceSequence).padStart(4,'0'),date:today(),supplyDate:job.date,lines:approved.lines,customer:job.name,reg:job.reg,vehicle:job.vehicle,estimate:approved.version};
  job.total=lineTotal(approved.lines);
 });
}
async function recordDecision(id,version,name,method,result){
 await updateWork(id,(job,work)=>{
  const estimate=latestEstimate(work);
  if(estimate?.version!==version||estimate.decision||work.invoice)throw Error('This estimate is no longer awaiting a decision.');
  estimate.decision={name,method,result,date:new Date().toLocaleString('en-GB',{timeZone:'Europe/London'})};
  if(result==='Approved')job.total=lineTotal(estimate.lines);
  if(job.status==='Awaiting approval'&&result==='Approved')job.status='In progress';
 });
}

function slots(date,service,exclude=''){
 const hours=opening(date);
 if(!hours)return [];
 const open=minutes(hours[0]),close=minutes(hours[1]);
 const now=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
 return Array.from({length:Math.max(0,Math.floor((close-open)/30)+1)},(_,i)=>{const start=open+i*30;return String(Math.floor(start/60)).padStart(2,'0')+':'+String(start%60).padStart(2,'0')}).filter(t=>{
   const start=minutes(t),end=start+services[service].length;
   return end<=close&&(staff||date>today()||date===today()&&t>now)&&lanes(service).some(b=>model.jobs.every(j=>j.id===exclude||j.bay!==b||j.date!==date||isClosed(j)||end<=minutes(j.time)||start>=minutes(j.time)+j.length))
 });
}

  const result=await request('staff',model);
  model.revision=result.revision;

  model=structuredClone(savedModel);

}

 const previous=model.jobs.find(j=>j.id===job.id);
 const same=previous&&['date','time','service'].every(k=>previous[k]===job[k]);

function reminderRows(m){
 const lead={...leadDefaults,...m.reminderLeads},now=today(),latest=new Map();
 const jobs=ordered(m.jobs.filter(j=>!isClosed(j))).reverse();
 for(const j of jobs){
  for(const [type,date] of [['MOT',j.motDue],['Service',j.serviceDue]]){
   const key=j.reg+'|'+type;
   if(date&&!latest.has(key))latest.set(key,{type,date,job:j,key:key+'|'+date});
  }
 }
 const collection=jobs.filter(j=>j.status==='Ready to collect').map(job=>({job,type:'Collection',date:now,key:job.id+'|Collection'}));
 return [...latest.values(),...collection].filter(r=>r.date<=advance(now,lead[r.type]));
}

  return row(type+' · '+job.reg,job.name+(type==='Collection'?'':' · '+shortDate(date)),'<div class="controls"><a class="button" href="'+escapeHTML(mailto(job.email,subject,'Hi '+job.name+',\n\n'+message+'\n\n'+model.name))+'">Open email draft</a><button class="button" data-sent="'+i+'">Mark sent</button></div>');
 }).join('')||'<p class="empty">No reminders due.</p>')+
 '<div class="rule"></div><h2>Sent history</h2>'+ (Object.values(sent).reverse().map(r=>row(r.type+' · '+r.reg,r.name+' · '+shortDate(r.sent),'')).join('')||'<p class="muted">No reminders marked sent yet.</p>')+'</section>';
 host.querySelectorAll('[data-sent]').forEach(button=>button.onclick=async()=>{
  const r=rows[Number(button.dataset.sent)];

  model.remindersSent??={};
  model.remindersSent[r.key]={type:r.type,reg:r.job.reg,name:r.job.name,sent:today()};
  await persist();renderReminders();
 });
}

async function shareApproval(id,version){
 if(!confirm('Generate a customer link? This replaces any previous link for this estimate.'))return;
 const job=model.jobs.find(j=>j.id===id);
 const {link}=await request('staff/approval',{job:id,version});
 dialog.innerHTML='<div class="pad"><h2 id="job-title">Send estimate for approval</h2>'+
 '<p>Copy this private link or open an email draft. The link expires after 14 days or once the customer responds.</p>'+
 field('Customer approval link','approvalLink',link,'readonly')+
 '<div class="controls"><button class="button" id="copy-link">Copy link</button>'+
 '<a class="button primary" href="'+escapeHTML(mailto(job.email,'Estimate for '+job.reg,'Hi '+job.name+',\n\nPlease review your estimate here:\n'+link+'\n\n'+model.name))+'">Open email draft</a>'+
 '<button class="button" id="back-work">Back to job card</button></div><p role="status"></p></div>';
 dialog.querySelector('#back-work').onclick=()=>renderWork(id);
 dialog.querySelector('#copy-link').onclick=async()=>{
  try{await navigator.clipboard.writeText(link);dialog.querySelector('[role=status]').textContent='Link copied.'}
  catch{dialog.querySelector('input').select();dialog.querySelector('[role=status]').textContent='Copy the selected link.'}
 };
}
start();
</script></body></html>
