services:
  servicesapp:
    build:
      context: /mnt/apps/garageappprog
    restart: unless-stopped
    init: true
    ports:
      - "30090:8080"
    environment:
      PUBLIC_ORIGIN: https://servicesapp.ivorydigital.uk
      WORKSHOP_DB: /data/workshop.sqlite3
    volumes:
      - type: bind
        source: /mnt/photographers_data/garageappclientdata/workshop
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
